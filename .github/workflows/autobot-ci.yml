name: Autobot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autobot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Autobot policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check the actual PR head, matching the controller's review evidence.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/autobot/tests -v
      - run: python3 -m compileall -q tools/autobot
      - name: Verify trusted role, skill, charter and schema packaging
        run: python3 tools/autobot/bundle.py

  rust:
    name: Autobot Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: autobot-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            autobot-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}-
      - name: Verify toolchain
        run: rustup show active-toolchain
      - name: Restore pinned nextest executable
        id: nextest-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: autobot-nextest-v1-0.9.145-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install pinned nextest on cache miss
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --version 0.9.145 --locked
      - name: Format, check and test
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo nextest run --locked -p stacks-common --lib
